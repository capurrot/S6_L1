<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pratica con il Grid System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <h1 class="mt-4">Pratica con il Grid System</h1>
      <div class="row text-center">
        <h2>Esercizio 1</h2>
        <div class="row">
          <div class="col-4">
            <div class="bg-primary text-light p-3 border border-black">1</div>
          </div>
          <div class="col-4">
            <div class="bg-primary text-light p-3 border border-black">2</div>
          </div>
          <div class="col-4">
            <div class="bg-primary text-light p-3 border border-black">3</div>
          </div>
        </div>
      </div>
      <div class="row text-center mt-3">
        <h2>Esercizio 2</h2>
        <div class="row">
          <div class="col-12 col-sm-12 col-md-12 col-lg-4 col-xl-4 col-xxl-4">
            <div class="bg-warning p-3 border border-black">1</div>
          </div>
          <div class="col-12 col-sm-12 col-md-12 col-lg-4 col-xl-4 col-xxl-4">
            <div class="bg-warning p-3 border border-black">2</div>
          </div>
          <div class="col-12 col-sm-12 col-md-12 col-lg-4 col-xl-4 col-xxl-4">
            <div class="bg-warning p-3 border border-black">3</div>
          </div>
        </div>
      </div>
      <div class="row text-center mt-3">
        <h2>Esercizio 3</h2>
        <div class="row mt-3">
          <div class="col-12">
            <div class="bg-success p-3 text-light border border-black">1</div>
          </div>
          <div class="col-12">
            <div class="bg-success p-3 text-light border border-black">2</div>
          </div>
          <div class="col-12">
            <div class="bg-success p-3 text-light border border-black">3</div>
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-12 col-sm-4">
            <div class="bg-success p-3 text-light border border-black">1</div>
          </div>
          <div class="col-12 col-sm-4">
            <div class="bg-success p-3 text-light border border-black">1</div>
          </div>
          <div class="col-12 col-sm-4">
            <div class="bg-success p-3 text-light border border-black">1</div>
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-12 col-md-4">
            <div class="bg-success p-3 text-light border border-black">1</div>
          </div>
          <div class="col-12 col-md-4">
            <div class="bg-success p-3 text-light border border-black">2</div>
          </div>
          <div class="col-12 col-md-4">
            <div class="bg-success p-3 text-light border border-black">3</div>
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-12 col-lg-4">
            <div class="bg-success p-3 text-light border border-black">1</div>
          </div>
          <div class="col-12 col-lg-4">
            <div class="bg-success p-3 text-light border border-black">2</div>
          </div>
          <div class="col-12 col-lg-4">
            <div class="bg-success p-3 text-light border border-black">3</div>
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-12 col-xl-4">
            <div class="bg-success p-3 text-light border border-black">1</div>
          </div>
          <div class="col-12 col-xl-4">
            <div class="bg-success p-3 text-light border border-black">2</div>
          </div>
          <div class="col-12 col-xl-4">
            <div class="bg-success p-3 text-light border border-black">3</div>
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-12 col-xxl-4">
            <div class="bg-success p-3 text-light border border-black">1</div>
          </div>
          <div class="col-12 col-xxl-4">
            <div class="bg-success p-3 text-light border border-black">2</div>
          </div>
          <div class="col-12 col-xxl-4">
            <div class="bg-success p-3 text-light border border-black">3</div>
          </div>
        </div>
      </div>
      <div class="row text-center mt-3">
        <h2>Esercizio 4</h2>
        <div class="row">
          <div class="col-5">
            <div class="bg-danger text-light p-3 border border-black">1</div>
          </div>
          <div class="col-2">
            <div class="bg-danger text-light p-3 border border-black">2</div>
          </div>
          <div class="col-5">
            <div class="bg-danger text-light p-3 border border-black">3</div>
          </div>
        </div>
      </div>
      <div class="row text-center mt-3">
        <h2>Esercizio 5</h2>
        <div class="row">
          <div class="col-xl-8">
            <div class="bg-info p-3 border border-black">
              <div class="row">
                <div class="div col-xl-6">
                  <div class="bg-secondary text-light border border-black">1.1</div>
                </div>
                <div class="div col-xl-6">
                  <div class="bg-secondary text-light border border-black">1.2</div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-xl-4">
            <div><div class="bg-info text-light p-3 border border-black">2</div></div>
          </div>
        </div>
      </div>
      <div class="row text-center mt-3">
        <h2>Esercizio6</h2>
        <div class="row">
          <div class="col-3 bg-dark text-light p-3 border border-black">1</div>
          <div class="col-3 offset-6 bg-dark text-light p-3 border border-black">2</div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
